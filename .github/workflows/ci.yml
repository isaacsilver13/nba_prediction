name: NBA Prediction Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Install autorun dependencies
        run: pip install openai
      - name: Check autoresearch paths
        run: |
          python -c "import autorun; assert autorun.REPO_ROOT == __import__('pathlib').Path.cwd().resolve()"
      - name: Odds collector tests
        run: |
          pip install pyarrow pytest
          python -m pytest tests/test_odds_collector.py -q
